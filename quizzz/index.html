<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Break the Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#0C0C0C;
  --surface:#1A1916;
  --surface-haut:#282622;
  --signal:#FF6B00;
  --juste:#46D6A6;
  --rate:#FF5A52;
  --doux:#9A9488;
  --clair:#FFFFFF;
  --display:'Bricolage Grotesque', system-ui, sans-serif;
  --wordmark:'Bebas Neue', 'Bricolage Grotesque', system-ui, sans-serif;
  --corps:system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--nuit); color:var(--clair); font-family:var(--corps);
  min-height:100vh; display:flex; justify-content:center;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
#app{width:100%; max-width:480px}
.ecran{display:none} .ecran.actif{display:block}

h1{font-family:var(--wordmark); font-size:66px; font-weight:400; letter-spacing:.02em;
  line-height:.9; text-transform:uppercase}
h1 span{color:var(--signal)}
.sous{color:var(--doux); font-size:15px; margin-top:10px; margin-bottom:28px}

/* --- marque Break the Quiz (style logo : lettrage creux + loupe orange) --- */
.entete{margin-bottom:22px}
.loupe{width:74px; height:74px; display:block; margin-bottom:14px}
.marque{font-family:var(--wordmark); text-transform:uppercase;
  line-height:.82; letter-spacing:.03em; user-select:none}
.marque .l{display:block; font-size:96px; color:transparent;
  -webkit-text-stroke:2px var(--clair); }
.marque .l.or{color:var(--signal); -webkit-text-stroke:0}
@media (max-width:380px){ .marque .l{font-size:78px} }

label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--doux); margin-bottom:8px}
input[type=text]{
  width:100%; padding:15px 16px; font-size:17px; font-family:var(--corps);
  background:var(--surface); border:2px solid transparent; border-radius:14px;
  color:var(--clair); outline:none;
}
input[type=text]:focus{border-color:var(--signal)}
input::placeholder{color:#5B5788}

button{
  width:100%; padding:16px; font-size:16px; font-weight:600; font-family:var(--corps);
  background:var(--signal); color:#140A00; border:none; border-radius:14px;
  cursor:pointer; margin-top:12px;
}
button:active{transform:scale(.985)}
button:disabled{opacity:.4; cursor:default}
button.discret{background:var(--surface-haut); color:var(--clair)}
button.mini{width:auto; padding:9px 14px; font-size:13px; margin:0}

.bloc{margin-bottom:26px}
.sep{display:flex; align-items:center; gap:12px; color:var(--doux);
  font-size:12px; margin:26px 0; text-transform:uppercase; letter-spacing:.1em}
.sep::before,.sep::after{content:''; flex:1; height:1px; background:var(--surface-haut)}

/* --- salon --- */
.code{
  font-family:var(--wordmark); font-size:60px; font-weight:400;
  letter-spacing:.22em; text-align:center; color:var(--signal);
  background:var(--surface); border-radius:18px; padding:22px 0 18px; margin-bottom:6px;
}
.code-aide{text-align:center; color:var(--doux); font-size:13px; margin-bottom:26px}

.jetons{display:flex; flex-wrap:wrap; gap:8px}
.jeton{
  padding:9px 14px; border-radius:11px; background:var(--surface);
  color:var(--doux); font-size:14px; cursor:pointer; user-select:none;
  border:2px solid transparent;
}
.jeton.on{background:var(--surface-haut); color:var(--clair); border-color:var(--signal)}

.joueur{
  display:flex; align-items:center; gap:12px; padding:13px 16px;
  background:var(--surface); border-radius:13px; margin-bottom:8px;
}
.joueur .nom{flex:1; font-weight:600}
.joueur .pts{font-family:var(--wordmark); font-weight:400; font-size:26px; letter-spacing:.03em; color:var(--signal)}
.joueur.absent{opacity:.4}
.joueur.ok{background:linear-gradient(90deg,rgba(70,214,166,.22),var(--surface))}
.rang{width:22px; color:var(--doux); font-size:13px; font-variant-numeric:tabular-nums}

/* --- jeu : l'element signature --- */
.compteur{text-align:center; margin:6px 0 22px}
.compteur .valeur{
  font-family:var(--wordmark); font-weight:400; font-size:88px; line-height:1;
  color:var(--signal); font-variant-numeric:tabular-nums; letter-spacing:.02em;
  transition:color .2s;
}
.compteur .valeur.fige{color:var(--juste)}
.compteur .etiquette{
  font-size:11px; text-transform:uppercase; letter-spacing:.16em;
  color:var(--doux); margin-top:6px;
}
.barre{height:5px; background:var(--surface); border-radius:3px; overflow:hidden; margin-top:16px}
.barre i{display:block; height:100%; width:100%; background:var(--signal);
  transform-origin:left; transition:transform .1s linear, background .2s}
.barre i.urgent{background:var(--rate)}
.barre i.fige{background:var(--juste)}

.meta{display:flex; justify-content:space-between; align-items:center;
  color:var(--doux); font-size:12px; text-transform:uppercase; letter-spacing:.1em}
.question{
  font-family:var(--display); font-size:26px; font-weight:600; line-height:1.28;
  margin:16px 0 24px; letter-spacing:-.01em;
}
#v-image{
  width:100%; max-height:300px; object-fit:contain; border-radius:16px;
  background:#fff; padding:10px; box-sizing:border-box; margin:4px 0 20px;
}
#saisie.faux{border-color:var(--rate); animation:secousse .3s}
@keyframes secousse{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.flash{
  padding:13px 16px; border-radius:13px; margin-bottom:10px; font-size:14px;
  background:var(--surface);
}
.flash b{color:var(--signal)}

/* --- fil des essais en direct --- */
.essais-titre{font-size:11px; text-transform:uppercase; letter-spacing:.14em;
  color:var(--doux); margin:20px 0 10px}
.essais{display:flex; flex-direction:column; gap:6px; max-height:210px; overflow-y:auto}
.essai{padding:9px 13px; border-radius:11px; background:var(--surface);
  font-size:14px; animation:apparait .2s ease-out}
.essai .qui{color:var(--signal); font-weight:600}
.essai .txt{color:var(--clair)}
.essai.ok{background:linear-gradient(90deg,rgba(70,214,166,.20),var(--surface))}
.essai.ok .quoi{color:var(--juste); font-weight:600}
.essais-vide{color:var(--doux); font-size:13px}
@keyframes apparait{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}

.reponse-bloc{text-align:center; padding:26px 0}
.reponse-bloc .quoi{color:var(--doux); font-size:12px; text-transform:uppercase; letter-spacing:.14em}
.reponse-bloc .valeur{font-family:var(--display); font-size:34px; font-weight:800;
  color:var(--juste); margin-top:8px}

.pied{margin-top:22px; display:flex; justify-content:center}
.lien{background:none; border:none; color:var(--doux); font-size:13px;
  text-decoration:underline; cursor:pointer; width:auto; padding:6px; margin:0}
.erreur{background:rgba(255,107,107,.14); color:var(--rate); padding:13px 16px;
  border-radius:13px; margin-bottom:14px; font-size:14px; display:none}

/* --- podium anime --- */
.podium{display:flex; align-items:flex-end; justify-content:center; gap:8px; margin:18px 0 22px}
.marche{flex:1; max-width:130px; display:flex; flex-direction:column; align-items:center;
  animation:monte .5s cubic-bezier(.2,.7,.3,1) both}
.marche.p1{animation-delay:.35s} .marche.p2{animation-delay:.12s} .marche.p3{animation-delay:.55s}
@keyframes monte{from{opacity:0; transform:translateY(34px)}to{opacity:1; transform:none}}
.marche .tete{font-weight:600; font-size:14px; text-align:center; margin-bottom:6px;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.marche .socle{width:100%; border-radius:13px 13px 0 0; background:var(--surface-haut);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:10px 4px}
.marche .medaille{font-size:26px; line-height:1}
.marche .sc{font-family:var(--wordmark); font-size:30px; letter-spacing:.03em; color:var(--signal)}
.marche.p1 .socle{height:150px; background:linear-gradient(180deg,var(--signal),#B34C00)}
.marche.p1 .sc{color:#140A00}
.marche.p2 .socle{height:112px}
.marche.p3 .socle{height:82px}
.statcard{display:flex; align-items:center; gap:13px; background:var(--surface);
  border-radius:13px; padding:12px 16px; margin-bottom:8px; font-size:14px; color:var(--doux)}
.statcard .emo{font-size:24px; line-height:1}
.statcard b{color:var(--clair); font-weight:600}
.indice-mot{letter-spacing:.18em; font-family:var(--wordmark); font-size:22px; color:var(--signal)}

/* --- reglages de partie --- */
.param{display:flex; align-items:center; justify-content:space-between;
  background:var(--surface); border-radius:12px; padding:10px 14px; margin-bottom:8px}
.param .lib{color:var(--doux); font-size:14px}
.param .ctrl{display:flex; align-items:center; gap:10px}
.param .val{font-family:var(--wordmark); font-size:24px; color:var(--signal);
  min-width:56px; text-align:center; letter-spacing:.02em}
.step{width:34px; height:34px; padding:0; margin:0; border-radius:9px;
  background:var(--surface-haut); color:var(--clair); font-size:20px; line-height:1}
.param.ro .step{display:none}

/* --- mode equipes --- */
.eqban{display:flex; gap:10px; margin:4px 0 16px}
.eqban .eq{flex:1; border-radius:13px; padding:12px 8px; text-align:center}
.eqban .eq .n{font-size:11px; text-transform:uppercase; letter-spacing:.12em}
.eqban .eq .s{font-family:var(--wordmark); font-size:38px; line-height:1; letter-spacing:.03em}
.eqban .eqA{background:rgba(255,90,82,.16); color:#FF5A52}
.eqban .eqB{background:rgba(74,144,217,.18); color:#4A90D9}
.eqban .eq.gagne{outline:2px solid currentColor}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle}
.dotA{background:#FF5A52} .dotB{background:#4A90D9}
.choix-eq{display:flex; gap:8px}
.choix-eq button{margin:0}
.choix-eq .cA{background:#FF5A52; color:#fff}
.choix-eq .cB{background:#4A90D9; color:#fff}
.choix-eq button.off{opacity:.4}

/* --- cartes de mode --- */
.modes{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mode-carte{
  background:var(--surface); border:2px solid transparent; border-radius:16px;
  padding:14px 14px 13px; cursor:pointer; user-select:none; position:relative;
  transition:border-color .15s, background .15s, transform .1s}
.mode-carte:active{transform:scale(.98)}
.mode-carte .ic{font-size:26px; line-height:1}
.mode-carte .ti{font-family:var(--wordmark); font-size:23px; letter-spacing:.04em;
  margin-top:6px; color:var(--clair)}
.mode-carte .de{font-size:12px; color:var(--doux); margin-top:3px; line-height:1.3}
.mode-carte.on{border-color:var(--signal); background:var(--surface-haut)}
.mode-carte.on .ti{color:var(--signal)}
.mode-carte.ro{cursor:default}
.mode-carte .check{position:absolute; top:10px; right:12px; color:var(--signal);
  font-weight:700; opacity:0}
.mode-carte.on .check{opacity:1}

/* --- pouvoirs en jeu --- */
.pouvoirs{margin-top:14px; background:var(--surface); border-radius:15px; padding:12px}
.pouvoirs .barre-p{display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px}
.pouvoirs .titre-p{font-size:12px; text-transform:uppercase; letter-spacing:.12em;
  color:var(--doux)}
.pouvoirs .charges{font-family:var(--wordmark); font-size:15px; letter-spacing:.08em;
  color:var(--signal)}
.pouvoirs .charges .vide{color:var(--surface-haut)}
.pv-grille{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.pv{background:var(--surface-haut); border:none; border-radius:12px; padding:10px 4px;
  cursor:pointer; color:var(--clair); display:flex; flex-direction:column;
  align-items:center; gap:3px; width:auto; margin:0}
.pv .pe{font-size:20px} .pv .pn{font-size:10px; color:var(--doux)}
.pv:disabled{opacity:.35; cursor:not-allowed}
.pv.pret{outline:2px solid rgba(255,107,0,.5)}
.pv.recharge{position:relative; overflow:hidden}

/* --- vies (survie) + coop --- */
.coeurs{letter-spacing:1px}
.coeurs .mort{filter:grayscale(1) opacity(.35)}
.eliminebox{background:rgba(255,90,82,.14); color:var(--rate); border-radius:13px;
  padding:12px 16px; margin-top:14px; font-size:14px; text-align:center}
.coopbar{background:var(--surface); border-radius:14px; padding:12px 14px; margin-bottom:14px}
.coopbar .lib{font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--doux);
  display:flex; justify-content:space-between}
.coopbar .piste{height:12px; background:var(--surface-haut); border-radius:7px; overflow:hidden;
  margin-top:8px}
.coopbar .piste i{display:block; height:100%; background:linear-gradient(90deg,var(--juste),var(--signal));
  transition:width .4s}
.gelvoile{position:fixed; inset:0; background:rgba(74,144,217,.22);
  backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center;
  z-index:50; color:#cfe4ff; font-family:var(--wordmark); font-size:40px; letter-spacing:.05em}
.entete-mode{font-family:var(--wordmark); font-size:34px; letter-spacing:.04em;
  text-align:center; margin-bottom:12px}
.tourban{background:var(--surface); border-radius:13px; padding:11px 14px;
  margin-bottom:12px; text-align:center; font-size:15px; color:var(--clair)}
.tourban b{color:var(--signal)}
.bracket{display:flex; flex-direction:column; gap:9px; margin:10px 0}
.duel{display:flex; align-items:center; gap:10px; background:var(--surface);
  border-radius:13px; padding:12px 14px}
.duel .vs{font-family:var(--wordmark); color:var(--doux); font-size:15px}
.duel .n1,.duel .n2{flex:1; font-weight:600}
.duel .n2{text-align:right}
.duel .gagne{color:var(--juste)}
.duel .perd{color:var(--doux); text-decoration:line-through; opacity:.6}
.bye{background:var(--surface); border-radius:11px; padding:9px 14px;
  color:var(--doux); font-size:13px}

@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <!-- BARRE HAUT (code du salon + retour accueil) -->
  <div id="topbar" style="display:none; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px">
    <span id="v-code-mini" style="font-family:var(--wordmark); font-size:22px; letter-spacing:.14em; color:var(--signal)"></span>
    <button id="b-home" class="mini discret" title="Revenir a l'accueil">&#8962; Accueil</button>
  </div>

  <!-- ACCUEIL -->
  <div class="ecran actif" id="ec-accueil">
    <div class="entete">
      <svg class="loupe" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="40" cy="40" r="30" fill="#FF6B00"/>
        <line x1="27" y1="42" x2="45" y2="26" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
        <circle cx="40" cy="40" r="30" stroke="#FFFFFF" stroke-width="5"/>
        <line x1="61" y1="61" x2="90" y2="90" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      </svg>
      <div class="marque">
        <span class="l">Break</span>
        <span class="l">The</span>
        <span class="l or">Quiz</span>
      </div>
    </div>
    <p class="sous">Un quiz entre amis. Chacun sur son telephone, tout le monde dans le meme salon. Le premier qui trouve marque le plus.</p>
    <div id="err" class="erreur"></div>
    <div class="bloc">
      <label for="pseudo">Ton pseudo</label>
      <input type="text" id="pseudo" maxlength="16" placeholder="Amine" autocomplete="off">
    </div>
    <button id="b-creer">Creer un salon</button>
    <div class="sep">ou</div>
    <div class="bloc">
      <label for="code">Code du salon</label>
      <input type="text" id="code" maxlength="4" placeholder="ABCD"
             autocomplete="off" autocapitalize="characters" style="text-transform:uppercase">
    </div>
    <button class="discret" id="b-rejoindre">Rejoindre</button>
  </div>

  <!-- SALON -->
  <div class="ecran" id="ec-salon">
    <div class="code" id="v-code">----</div>
    <p class="code-aide">Partage ce code pour qu'ils te rejoignent</p>
    <div class="bloc">
      <label>Categories</label>
      <div class="jetons" id="v-cats"></div>
    </div>
    <div class="bloc">
      <label>Difficulte</label>
      <div class="jetons" id="v-difs"></div>
    </div>
    <div class="bloc">
      <label>Mode de jeu</label>
      <div class="modes" id="v-modes"></div>
      <div id="v-equipe-choix" style="display:none; margin-top:12px"></div>
    </div>
    <div class="bloc">
      <label>Reglages de la partie</label>
      <div id="v-params"></div>
    </div>
    <div class="bloc">
      <label>Joueurs</label>
      <div id="v-joueurs"></div>
    </div>
    <button id="b-demarrer">Lancer la partie</button>
    <p class="code-aide" id="v-attente" style="margin-top:14px"></p>
  </div>

  <!-- JEU -->
  <div class="ecran" id="ec-jeu">
    <div class="meta">
      <span id="v-cat"></span>
      <span id="v-num"></span>
    </div>
    <div id="v-eq-jeu"></div>
    <div id="v-coop"></div>
    <div id="v-tour"></div>
    <div class="compteur">
      <div class="valeur" id="v-pts">10</div>
      <div class="etiquette" id="v-pts-txt">points en jeu</div>
      <div class="barre"><i id="v-barre"></i></div>
    </div>
    <p class="question" id="v-question"></p>
    <img id="v-image" alt="" style="display:none">
    <input type="text" id="saisie" placeholder="Ta reponse" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="pouvoirs" id="v-pouvoirs" style="display:none"></div>
    <div id="v-elimine"></div>
    <div id="v-flash" style="margin-top:16px"></div>
    <div class="essais-titre">Reponses des joueurs</div>
    <div class="essais" id="v-essais"></div>
    <div class="pied"><button class="lien" id="b-signaler">Signaler cette question</button></div>
  </div>

  <!-- ENTRE DEUX MANCHES -->
  <div class="ecran" id="ec-pause">
    <div class="reponse-bloc" id="v-reponse-bloc">
      <div class="quoi">La reponse etait</div>
      <div class="valeur" id="v-reponse"></div>
    </div>
    <div id="v-eq-pause"></div>
    <div id="v-scores"></div>
  </div>

  <!-- FIN -->
  <div class="ecran" id="ec-fin">
    <div id="v-eq-fin"></div>
    <div class="podium" id="v-podium"></div>
    <div id="v-stats" style="margin-bottom:18px"></div>
    <p class="sous">Classement final</p>
    <div id="v-classement"></div>
    <button id="b-rejouer">Rejouer</button>
  </div>

</div>

<script>
const $ = s => document.querySelector(s);
const CATS = {algerie:"Algerie", football:"Football", nba:"NBA", sport:"Sport",
  anime:"Anime", film:"Film", series:"Series", culture_g:"Culture G", geographie:"Geographie",
  histoire:"Histoire", physique:"Physique", musique:"Musique",
  animaux:"Animaux", voitures:"Voitures", jeuxvideo:"Jeux vidéo", logos:"Logos", drapeaux:"Drapeaux",
  aliments:"Aliments", langues:"Langues", corps:"Corps humain",
  cuisine:"Cuisine du monde", espace:"Espace", races:"Chiens & chats",
  nature:"Nature", jeuxsociete:"Jeux de société"};
const DIFS = {facile:"Facile", moyen:"Moyen", difficile:"Difficile"};

const MODES = {
  basique: {t:"Basique", e:"🎯", d:"Le classique. Premier au score cible gagne."},
  equipes: {t:"Équipes", e:"🔴🔵", d:"Rouge contre Bleu, score commun."},
  survie:  {t:"Survie", e:"❤️", d:"3 vies. Rate une manche, perds une vie. Dernier en vie gagne."},
  blitz:   {t:"Blitz", e:"⚡", d:"Chrono ultra court, 20 manches rapides."},
  coop:    {t:"Coop", e:"🤝", d:"Tous ensemble contre le chrono, un seul score."},
  chacun:  {t:"Chacun son tour", e:"🎤", d:"Un joueur répond à la fois, à tour de rôle."},
  tournoi: {t:"Tournoi", e:"🏆", d:"Duels 1v1 à élimination directe jusqu'au champion."},
  bombe:   {t:"Bombe", e:"💣", d:"Patate chaude : réponds vite et refile la bombe. Celui qui l'a quand elle explose perd une vie."},
};
// Quels reglages sont pertinents selon le mode
const PARAMS_MODE = {
  basique:["duree","objectif","manches_max"],
  equipes:["duree","objectif","manches_max"],
  survie: ["duree"],
  blitz:  [],
  coop:   ["duree","objectif","manches_max"],
  chacun: ["duree","objectif","manches_max"],
  tournoi:["duree"],
  bombe:  [],
};
const POUVOIRS = {
  indice:{e:"🔎", n:"Indice"}, gel:{e:"❄️", n:"Gel"},
  double:{e:"✖️2", n:"Double"}, skip:{e:"⏭️", n:"Passe"},
};

let ws, jeton, jeSuisHote = false, monPseudo = "";
let cats = Object.keys(CATS), difs = Object.keys(DIFS);
let tickeur = null, finManche = 0, dureeManche = 20, figee = false;
let regl = {duree:20, objectif:100, manches_max:0};
let equipesOn = false, scoresEqCourant = null;
let modeCourant = "basique";
let mesCharges = 0, monElimine = false, gelTimer = null, doubleArme = false;
let cooldownJusqua = 0, monTour = true;

function banniereEquipes(sc, gagnant){
  if (!sc) return "";
  const eq = (k,nom) => `<div class="eq eq${k} ${gagnant===k?"gagne":""}">
    <div class="n">${nom}</div><div class="s">${sc[k]}</div></div>`;
  return `<div class="eqban">${eq("A","Rouge")}${eq("B","Bleu")}</div>`;
}
function eqDepuisJoueurs(js){
  if (!equipesOn) return null;
  const s = {A:0, B:0};
  js.forEach(j => { if (j.equipe) s[j.equipe] += j.score; });
  return s;
}

// Un jeton stable permet de retrouver sa place apres une coupure reseau.
jeton = localStorage.getItem("jeton");
if (!jeton) { jeton = Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("jeton", jeton); }
$("#pseudo").value = localStorage.getItem("pseudo") || "";

function ecran(id){
  document.querySelectorAll(".ecran").forEach(e => e.classList.remove("actif"));
  $("#ec-" + id).classList.add("actif");
  $("#topbar").style.display = (id === "accueil") ? "none" : "flex";
}
function erreur(txt){
  const e = $("#err"); e.textContent = txt; e.style.display = "block";
  setTimeout(() => e.style.display = "none", 4000);
}
function envoyer(o){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function connecter(action){
  monPseudo = $("#pseudo").value.trim();
  if (!monPseudo) return erreur("Choisis un pseudo d'abord.");
  localStorage.setItem("pseudo", monPseudo);

  const ouvrir = () => {
    const p = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${p}://${location.host}/ws`);
    ws.onopen = () => envoyer({type:action, pseudo:monPseudo, jeton,
                               code:$("#code").value.trim().toUpperCase()});
    ws.onmessage = e => recevoir(JSON.parse(e.data));
    ws.onclose = () => { if (!$("#ec-accueil").classList.contains("actif"))
      setTimeout(() => { action = "rejoindre"; ouvrir(); }, 1500); };
  };
  ouvrir();
}

function recevoir(m){
  if (m.type === "erreur") return erreur(m.message);

  if (m.type === "entre"){
    $("#v-code").textContent = m.code;
    $("#v-code-mini").textContent = "Salon " + m.code;
    $("#code").value = m.code;
    ecran("salon");
  }

  if (m.type === "salon"){
    if (m.code) $("#v-code-mini").textContent = "Salon " + m.code;
    const moi = m.joueurs.find(j => j.pseudo === monPseudo);
    jeSuisHote = moi ? moi.hote : false;
    cats = m.categories; difs = m.difficultes;
    if (m.duree) regl.duree = m.duree;
    if (m.objectif) regl.objectif = m.objectif;
    if (typeof m.manches_max === "number") regl.manches_max = m.manches_max;
    equipesOn = !!m.equipes;
    if (m.mode) modeCourant = m.mode;
    dessinerJetons();
    dessinerModes();
    dessinerParams();
    const choix = $("#v-equipe-choix");
    if (modeCourant === "equipes"){
      const moi2 = m.joueurs.find(j => j.pseudo === monPseudo);
      const mine = moi2 ? moi2.equipe : null;
      choix.style.display = "block";
      choix.innerHTML = `<label>Ton équipe</label><div class="choix-eq">
        <button class="cA ${mine==='A'?'':'off'}" data-eq="A">Rouge</button>
        <button class="cB ${mine==='B'?'':'off'}" data-eq="B">Bleu</button></div>`;
    } else { choix.style.display = "none"; }
    $("#v-joueurs").innerHTML = m.joueurs.map(ligneJoueur).join("");
    $("#b-demarrer").style.display = jeSuisHote ? "block" : "none";
    $("#v-attente").textContent = jeSuisHote
      ? descrFin()
      : "En attente que l'hote lance la partie.";
    if (m.etat === "salon") ecran("salon");
  }

  if (m.type === "manche"){
    figee = false; doubleArme = false;
    if (m.mode) modeCourant = m.mode;
    finirGel();
    dureeManche = m.duree; finManche = Date.now() + m.duree * 1000;
    $("#v-cat").textContent = (CATS[m.categorie]||m.categorie) + " / " + m.difficulte;
    $("#v-num").textContent = "Manche " + m.numero;
    $("#v-question").textContent = m.question;
    const img = $("#v-image");
    if (m.image){ img.src = m.image; img.style.display = "block"; }
    else { img.style.display = "none"; img.removeAttribute("src"); }
    $("#v-flash").innerHTML = "";
    $("#v-essais").innerHTML = '<div class="essais-vide">Les essais de tout le monde s\'affichent ici.</div>';
    $("#saisie").value = "";
    $("#v-pts").classList.remove("fige");
    $("#v-barre").classList.remove("fige","urgent");
    $("#v-pts-txt").textContent = "points en jeu";
    $("#v-eq-jeu").innerHTML = equipesOn
      ? banniereEquipes(scoresEqCourant || {A:0,B:0}) : "";
    // Tour (chacun) / duel (tournoi) : qui peut repondre ?
    monTour = !monElimine;
    let banner = "";
    if (modeCourant === "chacun"){
      monTour = (m.tour === monPseudo) && !monElimine;
      banner = monTour ? "🎤 <b>À toi de jouer !</b>"
                       : `🎤 Au tour de <b>${m.tour || "?"}</b>`;
    } else if (modeCourant === "bombe"){
      monTour = (m.tour === monPseudo) && !monElimine;
      banner = monTour ? "💣 <b>Vite, réponds et refile la bombe !</b>"
                       : `💣 La bombe est chez <b>${m.tour || "?"}</b>…`;
    } else if (modeCourant === "tournoi" && m.match){
      const inMatch = m.match.includes(monPseudo);
      monTour = inMatch && !monElimine;
      const sc = m.match_score ? ` (${m.match_score[0]}–${m.match_score[1]})` : "";
      banner = `🏆 <b>${m.match[0]}</b> vs <b>${m.match[1]}</b>${sc}`
             + (inMatch ? " — à toi !" : " — spectateur");
    }
    $("#v-tour").innerHTML = banner ? `<div class="tourban">${banner}</div>` : "";
    ecran("jeu");
    majEcranMode();
    if (monTour) $("#saisie").focus();
    lancerTick();
  }

  if (m.type === "rate"){
    const s = $("#saisie");
    s.classList.add("faux"); s.select();
    setTimeout(() => s.classList.remove("faux"), 320);
  }

  if (m.type === "trouve"){
    figee = true; doubleArme = false;
    $("#saisie").disabled = true;
    $("#v-pts").textContent = "+" + m.points;
    $("#v-pts").classList.add("fige");
    $("#v-pts-txt").textContent = (m.double ? "×2 ! " : "")
      + (m.premier ? "trouvé en premier" : "trouvé");
    $("#v-barre").classList.add("fige");
    dessinerPouvoirs();
  }

  if (m.type === "essai"){
    const box = $("#v-essais");
    const vide = box.querySelector(".essais-vide");
    if (vide) vide.remove();
    const d = document.createElement("div");
    const qui = document.createElement("span");
    qui.className = "qui"; qui.textContent = m.pseudo;
    d.appendChild(qui);
    if (m.bon){
      d.className = "essai ok";
      const q = document.createElement("span");
      q.className = "quoi"; q.textContent = " a trouve ✔";
      d.appendChild(q);
    } else {
      d.className = "essai";
      const t = document.createElement("span");
      t.className = "txt"; t.textContent = " : " + m.texte;
      d.appendChild(t);
    }
    box.prepend(d);
    while (box.children.length > 40) box.lastChild.remove();
  }

  if (m.type === "quelquun_a_trouve"){
    // Le fil des essais annonce deja "a trouve". Ici on ne garde que
    // l'info de temps restant quand quelqu'un trouve en premier.
    if (m.premier){
      const f = document.createElement("div");
      f.className = "flash";
      f.innerHTML = `<b>${m.pseudo}</b> a trouve en premier. Il reste ${m.fin_dans} s.`;
      $("#v-flash").prepend(f);
      if (!figee) finManche = Date.now() + m.fin_dans * 1000;
    }
    if (m.joueurs){
      majMoi(m.joueurs);
      if (equipesOn){
        scoresEqCourant = eqDepuisJoueurs(m.joueurs);
        $("#v-eq-jeu").innerHTML = banniereEquipes(scoresEqCourant);
      }
      if (modeCourant === "coop"){
        const tot = m.joueurs.reduce((s,j)=>s+j.score,0);
        majCoop(tot);
      }
    }
  }

  if (m.type === "indice"){
    const f = document.createElement("div");
    f.className = "flash";
    f.innerHTML = `Indice : <span class="indice-mot">${m.indice}</span>`;
    $("#v-flash").prepend(f);
  }

  if (m.type === "gele_debut") debutGel(m.duree, m.par);
  if (m.type === "gele"){ /* essai ignore : voile deja affiche */ }
  if (m.type === "charge_gagnee"){ mesCharges = m.charges;
    toast("⚡ Charge de pouvoir gagnée"); dessinerPouvoirs(); }
  if (m.type === "pouvoir_ok"){ mesCharges = m.charges;
    cooldownJusqua = Date.now() + 8000;
    if (m.pouvoir === "double") doubleArme = true;
    if (m.pouvoir === "skip"){ figee = true; $("#saisie").disabled = true;
      $("#v-pts-txt").textContent = "manche passée"; }
    dessinerPouvoirs(); }
  if (m.type === "pouvoir_refuse") toast("Pouvoir pas prêt (recharge / pas de charge)");
  if (m.type === "pouvoir_joue" && m.pseudo !== monPseudo){
    const p = POUVOIRS[m.pouvoir] || {n:m.pouvoir, e:""};
    const f = document.createElement("div"); f.className = "flash";
    f.innerHTML = `<b>${m.pseudo}</b> a utilisé ${p.n} ${p.e}`;
    $("#v-flash").prepend(f);
  }

  if (m.type === "fin_manche"){
    clearInterval(tickeur); finirGel();
    majMoi(m.joueurs);
    $("#v-reponse-bloc").style.display = "block";
    $("#v-reponse").textContent = m.reponse;
    if (m.scores_equipes) scoresEqCourant = m.scores_equipes;
    $("#v-eq-pause").innerHTML = banniereEquipes(m.scores_equipes);
    let extra = "";
    if (m.mode === "coop" && typeof m.collectif === "number")
      extra += `<div class="coopbar"><div class="lib"><span>Score de l'équipe</span>
        <span>${m.collectif} / ${regl.objectif}</span></div>
        <div class="piste"><i style="width:${Math.min(100, m.collectif/regl.objectif*100)}%"></i></div></div>`;
    if (m.elimines && m.elimines.length)
      extra += `<div class="eliminebox">☠️ Éliminé${m.elimines.length>1?"s":""} : ${m.elimines.join(", ")}</div>`;
    $("#v-scores").innerHTML = extra + m.joueurs.map(ligneJoueur).join("");
    ecran("pause");
  }

  if (m.type === "tournoi_tour"){
    clearInterval(tickeur); finirGel();
    $("#v-reponse-bloc").style.display = "none";
    $("#v-eq-pause").innerHTML = `<div class="entete-mode">🏆 Tournoi — Tour ${m.tour}</div>`;
    let h = `<div class="bracket">`;
    h += (m.paires||[]).map(p => `<div class="duel"><span class="n1">${p[0]}</span>
       <span class="vs">VS</span><span class="n2">${p[1]}</span></div>`).join("");
    h += (m.byes||[]).map(b => `<div class="bye">${b} passe au tour suivant (bye)</div>`).join("");
    $("#v-scores").innerHTML = h + `</div>`;
    ecran("pause");
  }

  if (m.type === "tournoi_match_fin"){
    clearInterval(tickeur); finirGel();
    $("#v-reponse-bloc").style.display = "none";
    $("#v-eq-pause").innerHTML = `<div class="entete-mode">✅ ${m.gagnant} l'emporte !</div>`;
    $("#v-scores").innerHTML = `<div class="duel">
      <span class="n1 ${m.noms[0]===m.gagnant?"gagne":"perd"}">${m.noms[0]}</span>
      <span class="vs">${m.score[0]}–${m.score[1]}</span>
      <span class="n2 ${m.noms[1]===m.gagnant?"gagne":"perd"}">${m.noms[1]}</span></div>`;
    ecran("pause");
  }

  if (m.type === "bombe_explose"){
    clearInterval(tickeur); finirGel(); majMoi(m.joueurs);
    $("#v-reponse-bloc").style.display = "none";
    const sort = m.elimine ? " est éliminé ☠️" : ` perd une vie (${m.vies} restante${m.vies>1?"s":""})`;
    $("#v-eq-pause").innerHTML = `<div class="entete-mode">💥 ${m.pseudo}${sort}</div>`;
    $("#v-scores").innerHTML = (m.joueurs||[]).map(ligneJoueur).join("");
    ecran("pause");
  }

  if (m.type === "fin_partie"){
    clearInterval(tickeur); finirGel();
    const j = m.joueurs;
    let gEq = null;
    if (m.scores_equipes){
      const s = m.scores_equipes;
      gEq = s.A === s.B ? null : (s.A > s.B ? "A" : "B");
    }
    let tete = banniereEquipes(m.scores_equipes, gEq);
    if (m.mode === "tournoi")
      tete = `<div class="entete-mode">🏆 ${m.champion ? m.champion + " remporte le tournoi !" : "Tournoi terminé"}</div>`;
    else if (m.mode === "bombe")
      tete = `<div class="entete-mode">🏆 ${m.survivant ? m.survivant + " survit à la bombe !" : "Personne ne survit"}</div>`;
    else if (m.mode === "survie")
      tete = `<div class="entete-mode">🏆 ${m.survivant ? m.survivant + " survit !" : "Personne ne survit"}</div>`;
    else if (m.mode === "coop")
      tete = m.coop_reussi
        ? `<div class="entete-mode" style="color:var(--juste)">🎉 Objectif atteint ! ${m.collectif} pts</div>`
        : `<div class="entete-mode" style="color:var(--rate)">😬 Raté : ${m.collectif} / ${regl.objectif}</div>`;
    $("#v-eq-fin").innerHTML = tete;
    // Podium : 2e a gauche, 1er au milieu, 3e a droite.
    const ordre = [j[1], j[0], j[2]];
    const cls = ["p2","p1","p3"], med = ["🥈","🥇","🥉"];
    $("#v-podium").innerHTML = ordre.map((p,i) => p ?
      `<div class="marche ${cls[i]}"><div class="tete">${p.pseudo}</div>
        <div class="socle"><div class="medaille">${med[i]}</div>
        <div class="sc">${p.score}</div></div></div>` : "").join("");
    // Stats rigolotes.
    let s = "";
    const st = m.stats || {};
    if (st.plus_rapide) s += statcard("⚡","Réponse la plus rapide",
      `${st.plus_rapide.pseudo} en ${st.plus_rapide.temps}s`);
    if (st.roi_premier) s += statcard("🥇","Le plus souvent premier",
      `${st.roi_premier.pseudo} · ${st.roi_premier.n}×`);
    if (st.colles) s += statcard("🙈","Questions où personne n'a trouvé", `${st.colles}`);
    $("#v-stats").innerHTML = s;
    $("#v-classement").innerHTML = j.map(ligneJoueur).join("");
    $("#b-rejouer").style.display = "block";   // n'importe qui peut relancer
    ecran("fin");
  }
}

function statcard(emo, titre, valeur){
  return `<div class="statcard"><span class="emo">${emo}</span>
    <div>${titre}<br><b>${valeur}</b></div></div>`;
}

function ligneJoueur(j, i){
  const mort = j.elimine;
  const cls = "joueur" + (j.connecte ? "" : " absent") + (j.trouve ? " ok" : "")
    + (mort ? " absent" : "");
  const dot = j.equipe ? `<span class="dot dot${j.equipe}"></span>` : "";
  let coeurs = "";
  if ((modeCourant === "survie" || modeCourant === "bombe") && typeof j.vies === "number"){
    if (mort){ coeurs = ` <span class="coeurs">☠️</span>`; }
    else {
      let h = "";
      for (let k = 0; k < 3; k++) h += `<span class="${k < j.vies ? "" : "mort"}">❤️</span>`;
      coeurs = ` <span class="coeurs">${h}</span>`;
    }
  }
  return `<div class="${cls}"><span class="rang">${i+1}</span>
    <span class="nom">${dot}${j.pseudo}${coeurs}</span><span class="pts">${j.score}</span></div>`;
}

function dessinerJetons(){
  $("#v-cats").innerHTML = Object.entries(CATS).map(([k,v]) =>
    `<span class="jeton ${cats.includes(k)?"on":""}" data-c="${k}">${v}</span>`).join("");
  $("#v-difs").innerHTML = Object.entries(DIFS).map(([k,v]) =>
    `<span class="jeton ${difs.includes(k)?"on":""}" data-d="${k}">${v}</span>`).join("");
}

function dessinerParams(){
  const libs = {duree:"Chrono",
    objectif: modeCourant === "coop" ? "Objectif commun" : "Score cible",
    manches_max:"Nb de manches"};
  const keys = PARAMS_MODE[modeCourant] || Object.keys(libs);
  if (!keys.length){
    $("#v-params").innerHTML = `<div class="param ro"><span class="lib">Réglages automatiques pour ce mode ⚡</span></div>`;
    return;
  }
  const rows = keys.map(k => [k, libs[k]]);
  const val = k => (k === "manches_max" && !regl.manches_max) ? "∞"
    : regl[k] + (k === "duree" ? " s" : "");
  $("#v-params").innerHTML = rows.map(([k,lib]) =>
    `<div class="param ${jeSuisHote ? "" : "ro"}"><span class="lib">${lib}</span>
      <div class="ctrl">
        <button class="step" data-k="${k}" data-op="-">−</button>
        <span class="val">${val(k)}</span>
        <button class="step" data-k="${k}" data-op="+">+</button>
      </div></div>`).join("");
}

function dessinerModes(){
  $("#v-modes").innerHTML = Object.entries(MODES).map(([k,v]) =>
    `<div class="mode-carte ${modeCourant===k?"on":""} ${jeSuisHote?"":"ro"}" data-mode="${k}">
       <span class="check">✓</span>
       <div class="ic">${v.e}</div>
       <div class="ti">${v.t}</div>
       <div class="de">${v.d}</div>
     </div>`).join("");
}

function descrFin(){
  if (modeCourant === "survie") return "Dernier joueur en vie gagne (3 vies chacun).";
  if (modeCourant === "blitz")  return "Chrono court, 20 manches. Le plus de points gagne.";
  if (modeCourant === "coop")   return `Objectif commun : ${regl.objectif} points ensemble.`;
  if (modeCourant === "tournoi") return "Duels 1v1 à élimination directe. Il faut au moins 2 joueurs.";
  if (modeCourant === "bombe") return "Patate chaude : réponds vite et refile la bombe. Dernier en vie gagne (2 joueurs min).";
  if (modeCourant === "chacun")
    return "Chacun répond à son tour. " + (regl.manches_max
      ? `${regl.manches_max} manches.` : `Premier à ${regl.objectif} points.`);
  return regl.manches_max ? `Partie en ${regl.manches_max} manches.`
                          : `Premier à ${regl.objectif} points.`;
}

function majMoi(js){
  if (!js) return;
  const moi = js.find(j => j.pseudo === monPseudo);
  if (!moi) return;
  if (typeof moi.charges === "number") mesCharges = moi.charges;
  const avant = monElimine;
  monElimine = !!moi.elimine;
  if (monElimine !== avant && $("#ec-jeu").classList.contains("actif")) majEcranMode();
}

function dessinerPouvoirs(){
  const box = $("#v-pouvoirs");
  if (!$("#ec-jeu").classList.contains("actif") || modeCourant === "chacun"
      || modeCourant === "bombe" || !monTour){
    box.style.display = "none"; return;
  }
  box.style.display = "block";
  const dispo = mesCharges > 0 && !figee && !monElimine && monTour
    && Date.now() >= cooldownJusqua;
  const pastilles = [0,1,2].map(i =>
    `<span class="${i < mesCharges ? "" : "vide"}">◆</span>`).join("");
  const btns = Object.entries(POUVOIRS).map(([k,v]) =>
    `<button class="pv ${dispo?"pret":""}" data-pv="${k}" ${dispo?"":"disabled"}>
       <span class="pe">${v.e}</span><span class="pn">${v.n}</span></button>`).join("");
  box.innerHTML = `<div class="barre-p"><span class="titre-p">Pouvoirs</span>
      <span class="charges">${pastilles}</span></div>
      <div class="pv-grille">${btns}</div>`;
}

function majEcranMode(){
  $("#v-coop").innerHTML = (modeCourant === "coop")
    ? `<div class="coopbar"><div class="lib"><span>Objectif équipe</span>
       <span id="v-coop-txt">0 / ${regl.objectif}</span></div>
       <div class="piste"><i id="v-coop-jauge" style="width:0%"></i></div></div>` : "";
  $("#v-elimine").innerHTML = monElimine
    ? `<div class="eliminebox">☠️ Tu es éliminé — tu regardes en spectateur.</div>` : "";
  const s = $("#saisie");
  s.disabled = !monTour;
  s.placeholder = monTour ? "Ta reponse"
    : (monElimine ? "Éliminé"
       : (modeCourant === "chacun" ? "Ce n'est pas ton tour" : "Spectateur"));
  dessinerPouvoirs();
}

function majCoop(tot){
  const t = $("#v-coop-txt"), g = $("#v-coop-jauge");
  if (t) t.textContent = `${tot} / ${regl.objectif}`;
  if (g) g.style.width = Math.min(100, tot / regl.objectif * 100) + "%";
}

function debutGel(duree, par){
  finirGel();
  const v = document.createElement("div");
  v.className = "gelvoile"; v.id = "gelvoile";
  v.innerHTML = "❄️ Gelé " + duree + "s";
  document.body.appendChild(v);
  $("#saisie").disabled = true;
  gelTimer = setTimeout(finirGel, duree * 1000);
}
function finirGel(){
  if (gelTimer){ clearTimeout(gelTimer); gelTimer = null; }
  const v = $("#gelvoile"); if (v) v.remove();
  if (!monElimine && !figee && $("#ec-jeu").classList.contains("actif"))
    $("#saisie").disabled = false;
}

function toast(txt){
  const f = document.createElement("div");
  f.className = "flash"; f.textContent = txt;
  $("#v-flash").prepend(f);
  setTimeout(() => f.remove(), 2600);
}

// Le compteur de points qui fond : c'est lui qui met la pression.
function lancerTick(){
  clearInterval(tickeur);
  tickeur = setInterval(() => {
    const reste = Math.max(0, (finManche - Date.now()) / 1000);
    const part = 1 - Math.min(reste / dureeManche, 1);
    $("#v-barre").style.transform = `scaleX(${Math.min(reste/dureeManche,1)})`;
    if (!figee){
      $("#v-pts").textContent = Math.max(1, Math.round(10 - 9 * part));
      $("#v-barre").classList.toggle("urgent", reste <= 5);
    }
    if (reste <= 0) clearInterval(tickeur);
  }, 100);
}

$("#b-creer").onclick = () => connecter("creer");
$("#b-rejoindre").onclick = () => {
  if ($("#code").value.trim().length !== 4) return erreur("Le code fait 4 lettres.");
  connecter("rejoindre");
};
$("#b-demarrer").onclick = () => envoyer({type:"demarrer"});
$("#b-rejouer").onclick = () => envoyer({type:"demarrer"});
$("#b-home").onclick = () => {
  // On repasse sur l'accueil AVANT de fermer : evite la reconnexion auto.
  ecran("accueil");
  try { if (ws) ws.close(); } catch (e) {}
};
$("#b-signaler").onclick = e => {
  envoyer({type:"signaler"});
  e.target.textContent = "Signalee, merci"; e.target.disabled = true;
  setTimeout(() => { e.target.textContent = "Signaler cette question";
    e.target.disabled = false; }, 3000);
};
$("#saisie").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.value.trim()){
    envoyer({type:"reponse", texte:e.target.value});
    e.target.value = "";
  }
});
document.addEventListener("click", e => {
  const j = e.target.closest(".jeton");
  if (!j || !jeSuisHote) return;
  const liste = j.dataset.c ? cats : difs;
  const cle = j.dataset.c || j.dataset.d;
  const i = liste.indexOf(cle);
  if (i >= 0){ if (liste.length > 1) liste.splice(i,1); } else liste.push(cle);
  dessinerJetons();
  envoyer({type:"reglages", categories:cats, difficultes:difs});
});
document.addEventListener("click", e => {
  const b = e.target.closest(".step");
  if (!b || !jeSuisHote) return;
  const k = b.dataset.k, op = b.dataset.op === "+" ? 1 : -1;
  const cfg = {duree:[5,10,40], objectif:[10,20,300], manches_max:[1,0,50]};
  const [pas,mn,mx] = cfg[k];
  regl[k] = Math.max(mn, Math.min(mx, regl[k] + op*pas));
  dessinerParams();
  envoyer({type:"reglages", categories:cats, difficultes:difs,
    duree:regl.duree, objectif:regl.objectif, manches_max:regl.manches_max});
});
// Choix du mode (cartes) — reserve a l'hote
document.addEventListener("click", e => {
  const c = e.target.closest(".mode-carte");
  if (!c || !jeSuisHote) return;
  envoyer({type:"mode", mode:c.dataset.mode});
});
// Choix d'equipe (mode equipes)
document.addEventListener("click", e => {
  const b = e.target.closest(".choix-eq button");
  if (b) envoyer({type:"choisir_equipe", equipe:b.dataset.eq});
});
// Utiliser un pouvoir
document.addEventListener("click", e => {
  const b = e.target.closest(".pv");
  if (!b || b.disabled) return;
  envoyer({type:"pouvoir", pouvoir:b.dataset.pv});
  cooldownJusqua = Date.now() + 8000; dessinerPouvoirs();  // grise en attendant
});
dessinerJetons();
</script>
