<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#16152B;
  --surface:#232145;
  --surface-haut:#2E2B58;
  --signal:#FFC857;
  --juste:#46D6A6;
  --rate:#FF6B6B;
  --doux:#9E9AC8;
  --clair:#F2F0FF;
  --display:'Bricolage Grotesque', system-ui, sans-serif;
  --corps:system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--nuit); color:var(--clair); font-family:var(--corps);
  min-height:100vh; display:flex; justify-content:center;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
#app{width:100%; max-width:480px}
.ecran{display:none} .ecran.actif{display:block}

h1{font-family:var(--display); font-size:44px; font-weight:800; letter-spacing:-.03em; line-height:.95}
h1 span{color:var(--signal)}
.sous{color:var(--doux); font-size:15px; margin-top:10px; margin-bottom:28px}

label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--doux); margin-bottom:8px}
input[type=text]{
  width:100%; padding:15px 16px; font-size:17px; font-family:var(--corps);
  background:var(--surface); border:2px solid transparent; border-radius:14px;
  color:var(--clair); outline:none;
}
input[type=text]:focus{border-color:var(--signal)}
input::placeholder{color:#5B5788}

button{
  width:100%; padding:16px; font-size:16px; font-weight:600; font-family:var(--corps);
  background:var(--signal); color:#241E00; border:none; border-radius:14px;
  cursor:pointer; margin-top:12px;
}
button:active{transform:scale(.985)}
button:disabled{opacity:.4; cursor:default}
button.discret{background:var(--surface-haut); color:var(--clair)}
button.mini{width:auto; padding:9px 14px; font-size:13px; margin:0}

.bloc{margin-bottom:26px}
.sep{display:flex; align-items:center; gap:12px; color:var(--doux);
  font-size:12px; margin:26px 0; text-transform:uppercase; letter-spacing:.1em}
.sep::before,.sep::after{content:''; flex:1; height:1px; background:var(--surface-haut)}

/* --- salon --- */
.code{
  font-family:var(--display); font-size:56px; font-weight:800;
  letter-spacing:.18em; text-align:center; color:var(--signal);
  background:var(--surface); border-radius:18px; padding:22px 0 18px; margin-bottom:6px;
}
.code-aide{text-align:center; color:var(--doux); font-size:13px; margin-bottom:26px}

.jetons{display:flex; flex-wrap:wrap; gap:8px}
.jeton{
  padding:9px 14px; border-radius:11px; background:var(--surface);
  color:var(--doux); font-size:14px; cursor:pointer; user-select:none;
  border:2px solid transparent;
}
.jeton.on{background:var(--surface-haut); color:var(--clair); border-color:var(--signal)}

.joueur{
  display:flex; align-items:center; gap:12px; padding:13px 16px;
  background:var(--surface); border-radius:13px; margin-bottom:8px;
}
.joueur .nom{flex:1; font-weight:600}
.joueur .pts{font-family:var(--display); font-weight:800; font-size:20px; color:var(--signal)}
.joueur.absent{opacity:.4}
.joueur.ok{background:linear-gradient(90deg,rgba(70,214,166,.22),var(--surface))}
.rang{width:22px; color:var(--doux); font-size:13px; font-variant-numeric:tabular-nums}

/* --- jeu : l'element signature --- */
.compteur{text-align:center; margin:6px 0 22px}
.compteur .valeur{
  font-family:var(--display); font-weight:800; font-size:76px; line-height:1;
  color:var(--signal); font-variant-numeric:tabular-nums;
  transition:color .2s;
}
.compteur .valeur.fige{color:var(--juste)}
.compteur .etiquette{
  font-size:11px; text-transform:uppercase; letter-spacing:.16em;
  color:var(--doux); margin-top:6px;
}
.barre{height:5px; background:var(--surface); border-radius:3px; overflow:hidden; margin-top:16px}
.barre i{display:block; height:100%; width:100%; background:var(--signal);
  transform-origin:left; transition:transform .1s linear, background .2s}
.barre i.urgent{background:var(--rate)}
.barre i.fige{background:var(--juste)}

.meta{display:flex; justify-content:space-between; align-items:center;
  color:var(--doux); font-size:12px; text-transform:uppercase; letter-spacing:.1em}
.question{
  font-family:var(--display); font-size:26px; font-weight:600; line-height:1.28;
  margin:16px 0 24px; letter-spacing:-.01em;
}
#v-image{
  width:100%; max-height:300px; object-fit:contain; border-radius:16px;
  background:var(--surface); margin:4px 0 20px;
}
#saisie.faux{border-color:var(--rate); animation:secousse .3s}
@keyframes secousse{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.flash{
  padding:13px 16px; border-radius:13px; margin-bottom:10px; font-size:14px;
  background:var(--surface);
}
.flash b{color:var(--signal)}

.reponse-bloc{text-align:center; padding:26px 0}
.reponse-bloc .quoi{color:var(--doux); font-size:12px; text-transform:uppercase; letter-spacing:.14em}
.reponse-bloc .valeur{font-family:var(--display); font-size:34px; font-weight:800;
  color:var(--juste); margin-top:8px}

.pied{margin-top:22px; display:flex; justify-content:center}
.lien{background:none; border:none; color:var(--doux); font-size:13px;
  text-decoration:underline; cursor:pointer; width:auto; padding:6px; margin:0}
.erreur{background:rgba(255,107,107,.14); color:var(--rate); padding:13px 16px;
  border-radius:13px; margin-bottom:14px; font-size:14px; display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <!-- ACCUEIL -->
  <div class="ecran actif" id="ec-accueil">
    <h1>Le premier<br>qui <span>trouve</span></h1>
    <p class="sous">Un quiz entre amis. Chacun sur son telephone, tout le monde dans le meme salon.</p>
    <div id="err" class="erreur"></div>
    <div class="bloc">
      <label for="pseudo">Ton pseudo</label>
      <input type="text" id="pseudo" maxlength="16" placeholder="Amine" autocomplete="off">
    </div>
    <button id="b-creer">Creer un salon</button>
    <div class="sep">ou</div>
    <div class="bloc">
      <label for="code">Code du salon</label>
      <input type="text" id="code" maxlength="4" placeholder="ABCD"
             autocomplete="off" autocapitalize="characters" style="text-transform:uppercase">
    </div>
    <button class="discret" id="b-rejoindre">Rejoindre</button>
  </div>

  <!-- SALON -->
  <div class="ecran" id="ec-salon">
    <div class="code" id="v-code">----</div>
    <p class="code-aide">Partage ce code pour qu'ils te rejoignent</p>
    <div class="bloc">
      <label>Categories</label>
      <div class="jetons" id="v-cats"></div>
    </div>
    <div class="bloc">
      <label>Difficulte</label>
      <div class="jetons" id="v-difs"></div>
    </div>
    <div class="bloc">
      <label>Joueurs</label>
      <div id="v-joueurs"></div>
    </div>
    <button id="b-demarrer">Lancer la partie</button>
    <p class="code-aide" id="v-attente" style="margin-top:14px"></p>
  </div>

  <!-- JEU -->
  <div class="ecran" id="ec-jeu">
    <div class="meta">
      <span id="v-cat"></span>
      <span id="v-num"></span>
    </div>
    <div class="compteur">
      <div class="valeur" id="v-pts">10</div>
      <div class="etiquette" id="v-pts-txt">points en jeu</div>
      <div class="barre"><i id="v-barre"></i></div>
    </div>
    <p class="question" id="v-question"></p>
    <img id="v-image" alt="" style="display:none">
    <input type="text" id="saisie" placeholder="Ta reponse" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false">
    <div id="v-flash" style="margin-top:16px"></div>
    <div class="pied"><button class="lien" id="b-signaler">Signaler cette question</button></div>
  </div>

  <!-- ENTRE DEUX MANCHES -->
  <div class="ecran" id="ec-pause">
    <div class="reponse-bloc">
      <div class="quoi">La reponse etait</div>
      <div class="valeur" id="v-reponse"></div>
    </div>
    <div id="v-scores"></div>
  </div>

  <!-- FIN -->
  <div class="ecran" id="ec-fin">
    <h1 id="v-gagnant"></h1>
    <p class="sous">Classement final</p>
    <div id="v-classement"></div>
    <button id="b-rejouer">Rejouer</button>
  </div>

</div>

<script>
const $ = s => document.querySelector(s);
const CATS = {algerie:"Algerie", football:"Football", nba:"NBA", sport:"Sport",
  anime:"Anime", film:"Film", series:"Series", culture_g:"Culture G", geographie:"Geographie",
  histoire:"Histoire", physique:"Physique"};
const DIFS = {facile:"Facile", moyen:"Moyen", difficile:"Difficile"};

let ws, jeton, jeSuisHote = false, monPseudo = "";
let cats = Object.keys(CATS), difs = Object.keys(DIFS);
let tickeur = null, finManche = 0, dureeManche = 20, figee = false;

// Un jeton stable permet de retrouver sa place apres une coupure reseau.
jeton = localStorage.getItem("jeton");
if (!jeton) { jeton = Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("jeton", jeton); }
$("#pseudo").value = localStorage.getItem("pseudo") || "";

function ecran(id){
  document.querySelectorAll(".ecran").forEach(e => e.classList.remove("actif"));
  $("#ec-" + id).classList.add("actif");
}
function erreur(txt){
  const e = $("#err"); e.textContent = txt; e.style.display = "block";
  setTimeout(() => e.style.display = "none", 4000);
}
function envoyer(o){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function connecter(action){
  monPseudo = $("#pseudo").value.trim();
  if (!monPseudo) return erreur("Choisis un pseudo d'abord.");
  localStorage.setItem("pseudo", monPseudo);

  const ouvrir = () => {
    const p = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${p}://${location.host}/ws`);
    ws.onopen = () => envoyer({type:action, pseudo:monPseudo, jeton,
                               code:$("#code").value.trim().toUpperCase()});
    ws.onmessage = e => recevoir(JSON.parse(e.data));
    ws.onclose = () => { if (!$("#ec-accueil").classList.contains("actif"))
      setTimeout(() => { action = "rejoindre"; ouvrir(); }, 1500); };
  };
  ouvrir();
}

function recevoir(m){
  if (m.type === "erreur") return erreur(m.message);

  if (m.type === "entre"){
    $("#v-code").textContent = m.code;
    $("#code").value = m.code;
    ecran("salon");
  }

  if (m.type === "salon"){
    const moi = m.joueurs.find(j => j.pseudo === monPseudo);
    jeSuisHote = moi ? moi.hote : false;
    cats = m.categories; difs = m.difficultes;
    dessinerJetons();
    $("#v-joueurs").innerHTML = m.joueurs.map(ligneJoueur).join("");
    $("#b-demarrer").style.display = jeSuisHote ? "block" : "none";
    $("#v-attente").textContent = jeSuisHote
      ? `Premier a ${m.objectif} points.`
      : "En attente que l'hote lance la partie.";
    if (m.etat === "salon") ecran("salon");
  }

  if (m.type === "manche"){
    figee = false;
    dureeManche = m.duree; finManche = Date.now() + m.duree * 1000;
    $("#v-cat").textContent = (CATS[m.categorie]||m.categorie) + " / " + m.difficulte;
    $("#v-num").textContent = "Manche " + m.numero;
    $("#v-question").textContent = m.question;
    const img = $("#v-image");
    if (m.image){ img.src = m.image; img.style.display = "block"; }
    else { img.style.display = "none"; img.removeAttribute("src"); }
    $("#v-flash").innerHTML = "";
    $("#saisie").value = ""; $("#saisie").disabled = false;
    $("#v-pts").classList.remove("fige");
    $("#v-barre").classList.remove("fige","urgent");
    $("#v-pts-txt").textContent = "points en jeu";
    ecran("jeu");
    $("#saisie").focus();
    lancerTick();
  }

  if (m.type === "rate"){
    const s = $("#saisie");
    s.classList.add("faux"); s.select();
    setTimeout(() => s.classList.remove("faux"), 320);
  }

  if (m.type === "trouve"){
    figee = true;
    $("#saisie").disabled = true;
    $("#v-pts").textContent = "+" + m.points;
    $("#v-pts").classList.add("fige");
    $("#v-pts-txt").textContent = m.premier ? "trouve en premier" : "trouve";
    $("#v-barre").classList.add("fige");
  }

  if (m.type === "quelquun_a_trouve"){
    const f = document.createElement("div");
    f.className = "flash";
    f.innerHTML = m.premier
      ? `<b>${m.pseudo}</b> a trouve en premier. Il reste ${m.fin_dans} s.`
      : `<b>${m.pseudo}</b> a trouve.`;
    $("#v-flash").prepend(f);
    if (m.premier && !figee) finManche = Date.now() + m.fin_dans * 1000;
  }

  if (m.type === "fin_manche"){
    clearInterval(tickeur);
    $("#v-reponse").textContent = m.reponse;
    $("#v-scores").innerHTML = m.joueurs.map(ligneJoueur).join("");
    ecran("pause");
  }

  if (m.type === "fin_partie"){
    clearInterval(tickeur);
    const g = m.joueurs[0];
    $("#v-gagnant").innerHTML = `<span>${g.pseudo}</span><br>gagne`;
    $("#v-classement").innerHTML = m.joueurs.map(ligneJoueur).join("");
    $("#b-rejouer").style.display = jeSuisHote ? "block" : "none";
    ecran("fin");
  }
}

function ligneJoueur(j, i){
  const cls = "joueur" + (j.connecte ? "" : " absent") + (j.trouve ? " ok" : "");
  return `<div class="${cls}"><span class="rang">${i+1}</span>
    <span class="nom">${j.pseudo}</span><span class="pts">${j.score}</span></div>`;
}

function dessinerJetons(){
  $("#v-cats").innerHTML = Object.entries(CATS).map(([k,v]) =>
    `<span class="jeton ${cats.includes(k)?"on":""}" data-c="${k}">${v}</span>`).join("");
  $("#v-difs").innerHTML = Object.entries(DIFS).map(([k,v]) =>
    `<span class="jeton ${difs.includes(k)?"on":""}" data-d="${k}">${v}</span>`).join("");
}

// Le compteur de points qui fond : c'est lui qui met la pression.
function lancerTick(){
  clearInterval(tickeur);
  tickeur = setInterval(() => {
    const reste = Math.max(0, (finManche - Date.now()) / 1000);
    const part = 1 - Math.min(reste / dureeManche, 1);
    $("#v-barre").style.transform = `scaleX(${Math.min(reste/dureeManche,1)})`;
    if (!figee){
      $("#v-pts").textContent = Math.max(1, Math.round(10 - 9 * part));
      $("#v-barre").classList.toggle("urgent", reste <= 5);
    }
    if (reste <= 0) clearInterval(tickeur);
  }, 100);
}

$("#b-creer").onclick = () => connecter("creer");
$("#b-rejoindre").onclick = () => {
  if ($("#code").value.trim().length !== 4) return erreur("Le code fait 4 lettres.");
  connecter("rejoindre");
};
$("#b-demarrer").onclick = () => envoyer({type:"demarrer"});
$("#b-rejouer").onclick = () => envoyer({type:"demarrer"});
$("#b-signaler").onclick = e => {
  envoyer({type:"signaler"});
  e.target.textContent = "Signalee, merci"; e.target.disabled = true;
  setTimeout(() => { e.target.textContent = "Signaler cette question";
    e.target.disabled = false; }, 3000);
};
$("#saisie").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.value.trim()){
    envoyer({type:"reponse", texte:e.target.value});
    e.target.value = "";
  }
});
document.addEventListener("click", e => {
  const j = e.target.closest(".jeton");
  if (!j || !jeSuisHote) return;
  const liste = j.dataset.c ? cats : difs;
  const cle = j.dataset.c || j.dataset.d;
  const i = liste.indexOf(cle);
  if (i >= 0){ if (liste.length > 1) liste.splice(i,1); } else liste.push(cle);
  dessinerJetons();
  envoyer({type:"reglages", categories:cats, difficultes:difs});
});
dessinerJetons();
</script>
</body>
</html>
